# Deploys the staging Worker (growth-intelligence-staging). Run by hand from the
# Actions tab. Production deploys get their own workflow once staging is approved.
name: Deploy staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - name: Build
        run: CLOUDFLARE_ENV=staging npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The Worker reads SUPABASE_URL at run time. Keep it as a Worker secret from the same GitHub
      # secret the build uses, so a deploy can never leave the Worker without it (a value typed into
      # the Cloudflare dashboard as a plain variable is removed by every deploy).
      - name: Set Supabase address on the Worker
        run: node -e 'process.stdout.write(JSON.stringify({ SUPABASE_URL: process.env.SUPABASE_URL }))' | npx wrangler secret bulk --name growth-intelligence-staging
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
